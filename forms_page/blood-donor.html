<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="icon" type="image/png" href="../midia/logo-hc.png">
    <title> Formulário do doador 🩸 </title>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-logo">
            <img src="../midia/logo-hc.png" alt="HemoConecta">
        </div>

        <ul class="navbar-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="pacientes.html">Pacientes</a></li>
            <li><a href="doadores.html">Doadores</a></li>
        </ul>

        <div class="navbar-action">
            <a href="match.html" class="btn-active">Match</a>
        </div>

        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </nav>
    
    <form action="process-donor.html" method="get">
        <div class="form-container">
            <div class="title-form">
                <h2>Formulário do Doador</h2>
            </div>
            <div class="text-form">
                <h4>Informações pessoais</h4>
                <hr>
            </div>
            <div class="form-group">
                <label for="name">Nome Completo:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" required>
            </div>
            <div class="form-group">
                <label for="birth">Data de Nascimento:</label>
                <input type="date" id="birth" name="birth" required>
            </div>
            <div class="text-form">
                <h4>Endereço</h4>
                <hr>
            </div>
            <div class="form-group">
                <label for="donor-address-street">Endereço:</label>
                <input type="text" id="donor-address-street" name="donor-address-street" required>
            </div>
            <div class="form-group">
                <label for="donor-address-number">Número:</label>
                <input type="text" id="donor-address-number" name="donor-address-number" required>
            </div>
            <div class="form-group">
                <label for="donor-state">Estado:</label>
                <select name="donor-state" id="donor-state" required>
                    <option value="">Selecione o estado</option>
                </select> 
            </div>
            <div class="form-group">
                <label for="donor-address-city">Cidade:</label>
                <input type="text" id="donor-address-city" name="donor-address-city" required>
            </div>
            <div class="text-form">
                <h4>Informações médicas</h4>
                <hr>
            </div>
            <div class="form-group">
                <label for="blood-type"> Tipo Sanguíneo:</label>
                <select id="blood-type" name="blood-type" required>
                    <option value="">Selecione o tipo sanguíneo</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>
            <div class="form-group">
                <label for="donor-history">Já doou alguma vez? </label>
                <input type="radio" name="donor-history" id="yes" value="yes" required>
                <label for="yes">Sim</label>
                <input type="radio" name="donor-history" id="no" value="no" required>
                <label for="no">Não</label>
            </div>
            <div class="form-group">
                <label for="donor-last-date">Data da última doação:</label>
                <input type="date" id="donor-last-date" name="donor-last-date">
            </div>
        </div>
    </form>
    <footer class="footer">
        <div class="footer-content"> 
            <p>
                © 2026 <strong>Redlife</strong> — Sistema de apoio à doação de sangue
            </p>
            <p class="footer-sub">
                Projeto desenvolvido para fins educacionais e portfólio
            </p>
        </div>
    </footer>

    <script src="../js/api.js"></script>
    <script src="../js/main.js"></script>

</body>
</html>
